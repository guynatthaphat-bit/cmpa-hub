# =============================================================================
# CMPA Hub — Nginx server config
# Reverse proxy + Let's Encrypt SSL + security headers
# =============================================================================

# HTTP → redirect to HTTPS (except ACME challenge)
server {
    listen 80;
    listen [::]:80;
    server_name 76-13-184-76.nip.io;

    # Let's Encrypt ACME challenge — must stay on HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — primary
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 76-13-184-76.nip.io;

    # ---- SSL ----
    ssl_certificate     /etc/letsencrypt/live/76-13-184-76.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/76-13-184-76.nip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # ---- Upload limit ----
    client_max_body_size 25M;
    client_body_timeout 60s;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ---- Static files (uploads, read-only) ----
    location /storage/ {
        alias /var/cmpa/storage/;
        # Block direct access — must go through app for auth
        internal;
    }

    # ---- App proxy ----
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Next.js static assets — long cache ----
    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Service worker — no cache ----
    location = /sw.js {
        proxy_pass http://app:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- Manifest — short cache ----
    location = /manifest.json {
        proxy_pass http://app:3000;
        add_header Cache-Control "public, max-age=3600";
    }
}
