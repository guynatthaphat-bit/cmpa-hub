services:
  - type: web
    name: cmpa-hub
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: app
    buildCommand: "npm install && npx prisma generate && npx prisma db push --skip-generate --accept-data-loss && npx tsx prisma/seed.ts && npm run build"
    startCommand: "npm run start"
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: ADMIN_EMAIL
        value: natthaphat@cmpa.or.th
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_FIRST_NAME
        value: "ฐานพัฒน์"
      - key: ADMIN_LAST_NAME
        value: "สิริโชติพิพัฒ"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: PAPERCLIP_URL
        value: ""
      - key: PAPERCLIP_ENABLED
        value: "false"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: STORAGE_PATH
        value: /var/cmpa/storage
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: FEATURE_R2_BACKUP
        value: "false"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: FEATURE_PUSH_NOTIFICATIONS
        value: "false"
      - key: NODE_VERSION
        value: "20.18.0"
